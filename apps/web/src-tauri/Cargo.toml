[package]
name = "code-fatality"
version = "0.1.0"
description = "CODE FATALITY desktop"
authors = ["CODE FATALITY"]
edition = "2021"

[lib]
name = "code_fatality_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
