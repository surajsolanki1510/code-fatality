name: Build Free App Downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web bundle
        env:
          VITE_API_URL: https://code-fatality.onrender.com
        run: npm run build:native

      - name: Prepare Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply app logo to Android icons
        run: npm run icons:tauri

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: code-fatality-android
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run icons:tauri

      - name: Build Tauri Windows app
        env:
          VITE_API_URL: https://code-fatality.onrender.com
          VITE_DESKTOP_BUILD: ${{ github.run_number }}
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: code-fatality-windows
          path: |
            apps/web/src-tauri/target/release/bundle/msi/*.msi
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish Downloads
    needs: [android, windows]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p out
          find artifacts -type f -name '*.apk' -exec cp {} out/CODE-FATALITY-android.apk \;
          find artifacts -type f -name '*.msi' -exec cp {} out/CODE-FATALITY-windows.msi \; || true
          find artifacts -type f -name '*.exe' -exec cp {} out/CODE-FATALITY-windows-setup.exe \; || true
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CODE FATALITY build-${{ github.run_number }}
          body: |
            Free downloadable builds:

            - **Android:** `CODE-FATALITY-android.apk`
            - **Windows:** `CODE-FATALITY-windows-setup.exe` / `.msi` (when available)

            API: https://code-fatality.onrender.com
            Web: https://code-fatality.vercel.app

            Note: first API request may be slow on free Render sleep.
          files: out/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
